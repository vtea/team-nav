name: Docker Image CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 多阶段 Dockerfile 内在容器内完成 npm 与 Maven，此处仅需构建并推送镜像
      - name: Docker build
        run: |
          IMAGE_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=${REGISTRY}/${IMAGE_LOWER}" >> "$GITHUB_ENV"
          docker build . --file Dockerfile --tag "${REGISTRY}/${IMAGE_LOWER}:sha-${{ github.sha }}" --tag "${REGISTRY}/${IMAGE_LOWER}:latest"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push "${IMAGE}:sha-${{ github.sha }}"
          docker push "${IMAGE}:latest"
